name: バグ報告
description: 不具合の報告
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージやスクリーンショットがあれば添付
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 発生環境
      options:
        - ローカル（vite dev）
        - ローカル（wrangler dev）
        - 本番（Workers）
    validations:
      required: true
